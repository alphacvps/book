from: markdown
to: pdf

metadata-file:
  - metadata/book.yaml

pdf-engine: lualatex

# Scelta della classe editoriale KOMA-Script e parametri di stampa
variables:
  documentclass: scrbook
  papersize: a4
  fontsize: 11pt
  linestretch: 1.15            # Interlinea editoriale leggermente più ampia
  classoption:
    - titlepage=true          # Genera una pagina di copertina separata
    - open=right              # I capitoli iniziano sempre su pagina destra (dispari)
    - twoside=true            # Impaginazione fronte/retro
    - BCOR=8mm                # Correzione margine di rilegatura interno
  geometry:
    - top=25mm
    - bottom=30mm
    - inner=20mm
    - outer=25mm

# Indice e numerazione
number-sections: true
toc: true
toc-depth: 2
